<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>

    <!-- Aurora Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D2D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Linear Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="40%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0FDFC"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Card Fill & Stroke Gradient -->
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0.15"/>
    </linearGradient>
    
    <!-- Neon Drop Shadow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowBlue)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.06" stroke="#00D2D3" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Outer Glass Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2"/>

  <!-- Brand Icon Shield (Centered / Left Aligned Composition) -->
  <g transform="translate(85, 60)" filter="url(#subtleShadow)">
    <!-- Outer Glow for Icon -->
    <circle cx="80" cy="80" r="95" fill="#00D2D3" opacity="0.12" filter="blur(20px)"/>
    
    <!-- Icon Container Glass Backdrop -->
    <rect width="160" height="160" rx="36" fill="#131C31" fill-opacity="0.65" stroke="url(#cardBorderGrad)" stroke-width="2"/>
    
    <!-- Shield Path Scaled -->
    <g transform="translate(30, 30) scale(4.16)">
      <path fill="url(#brandGrad)" d="M3 5.75A.75.75 0 0 1 3.75 5c2.663 0 5.258-.943 7.8-2.85a.75.75 0 0 1 .9 0C14.992 4.057 17.587 5 20.25 5a.75.75 0 0 1 .75.75V11q0 .507-.04.996a6.5 6.5 0 0 0-1.465-.684q.005-.155.005-.312V6.478c-2.577-.152-5.08-1.09-7.5-2.8c-2.42 1.71-4.923 2.648-7.5 2.8V11c0 4.149 2.332 7.221 7.125 9.285a6.5 6.5 0 0 0 1.005 1.52l-.355.143a.75.75 0 0 1-.55 0C5.958 19.676 3 16 3 11zM23 17.5a5.5 5.5 0 1 1-11 0a5.5 5.5 0 0 1 11 0m-2.146-2.354a.5.5 0 0 0-.708 0L16.5 18.793l-1.646-1.647a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l4-4a.5.5 0 0 0 0-.708"/>
    </g>
  </g>

  <!-- Main Titles Header -->
  <g transform="translate(280, 85)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
      STARTUP MONITOR
    </text>

    <!-- Version Badge Inside Banner -->
    <g transform="translate(480, -38)">
      <rect width="90" height="28" rx="14" fill="#00D2D3" fill-opacity="0.15" stroke="#00D2D3" stroke-width="1.2"/>
      <text x="45" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#00F5D4" text-anchor="middle">v2.1.1</text>
    </g>

    <!-- Subtitle -->
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Next-Gen Windows Security &amp; Kernel Optimization Platform
    </text>

    <!-- Highlights Micro-Row -->
    <g transform="translate(0, 82)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">
        ⚡ ZERO-OVERHEAD ETW KERNEL  •  🛡️ DYNAMIC WFP FIREWALL  •  🧠 AI THREAT HEURISTICS
      </text>
    </g>
  </g>

  <!-- 4 Feature Badges (Bottom Row Cards) -->
  <g transform="translate(85, 275)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="242" height="92" rx="14" fill="#131F37" fill-opacity="0.6" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">⚡</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">ETW Kernel Engine</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Realtime sub-ms hooks</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">0% idle CPU overhead</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(262, 0)">
      <rect width="242" height="92" rx="14" fill="#131F37" fill-opacity="0.6" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🧱</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Dynamic Firewall</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">WFP transient filters</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Port Defender (Fail2ban)</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(524, 0)">
      <rect width="242" height="92" rx="14" fill="#131F37" fill-opacity="0.6" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🧠</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">AI Threat Analysis</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Kaspersky OpenTIP cloud</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Groq / Ollama / OpenAI</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(786, 0)">
      <rect width="242" height="92" rx="14" fill="#131F37" fill-opacity="0.6" stroke="url(#cardBorderGrad)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🔒</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">29-Location Guard</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Safe Disable &amp; Restore</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Zero-Loss Persistence</text>
    </g>
  </g>
</svg>
