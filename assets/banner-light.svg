<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Light -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Subtle Radial Glows for Light Mode -->
    <radialGradient id="glowCyanLight" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D2D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlueLight" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Linear Gradient -->
    <linearGradient id="brandGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4B5"/>
      <stop offset="50%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#0066B8"/>
    </linearGradient>

    <!-- Text Gradient Light -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>

    <!-- Card Fill & Stroke Gradient -->
    <linearGradient id="cardBorderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="cardShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradLight)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowCyanLight)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowBlueLight)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.04" stroke="#0078D4" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Outer Glass Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#cardBorderGradLight)" stroke-width="1.5"/>

  <!-- Brand Icon Shield (Centered / Left Aligned Composition) -->
  <g transform="translate(85, 60)" filter="url(#cardShadowLight)">
    <!-- Icon Container Glass Backdrop -->
    <rect width="160" height="160" rx="36" fill="#FFFFFF" stroke="url(#cardBorderGradLight)" stroke-width="2"/>
    
    <!-- Shield Path Scaled -->
    <g transform="translate(30, 30) scale(4.16)">
      <path fill="url(#brandGradLight)" d="M3 5.75A.75.75 0 0 1 3.75 5c2.663 0 5.258-.943 7.8-2.85a.75.75 0 0 1 .9 0C14.992 4.057 17.587 5 20.25 5a.75.75 0 0 1 .75.75V11q0 .507-.04.996a6.5 6.5 0 0 0-1.465-.684q.005-.155.005-.312V6.478c-2.577-.152-5.08-1.09-7.5-2.8c-2.42 1.71-4.923 2.648-7.5 2.8V11c0 4.149 2.332 7.221 7.125 9.285a6.5 6.5 0 0 0 1.005 1.52l-.355.143a.75.75 0 0 1-.55 0C5.958 19.676 3 16 3 11zM23 17.5a5.5 5.5 0 1 1-11 0a5.5 5.5 0 0 1 11 0m-2.146-2.354a.5.5 0 0 0-.708 0L16.5 18.793l-1.646-1.647a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l4-4a.5.5 0 0 0 0-.708"/>
    </g>
  </g>

  <!-- Main Titles Header -->
  <g transform="translate(280, 85)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="800" fill="url(#textGradLight)" letter-spacing="-1">
      STARTUP MONITOR
    </text>

    <!-- Version Badge Inside Banner -->
    <g transform="translate(480, -38)">
      <rect width="90" height="28" rx="14" fill="#0078D4" fill-opacity="0.1" stroke="#0078D4" stroke-width="1.2"/>
      <text x="45" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#0066B8" text-anchor="middle">v2.1.1</text>
    </g>

    <!-- Subtitle -->
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="500" fill="#475569" letter-spacing="0.2">
      Next-Gen Windows Security &amp; Kernel Optimization Platform
    </text>

    <!-- Highlights Micro-Row -->
    <g transform="translate(0, 82)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#0284C7">
        ⚡ ZERO-OVERHEAD ETW KERNEL  •  🛡️ DYNAMIC WFP FIREWALL  •  🧠 AI THREAT HEURISTICS
      </text>
    </g>
  </g>

  <!-- 4 Feature Badges (Bottom Row Cards) -->
  <g transform="translate(85, 275)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#cardShadowLight)">
      <rect width="242" height="92" rx="14" fill="#FFFFFF" stroke="url(#cardBorderGradLight)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">⚡</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">ETW Kernel Engine</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Realtime sub-ms hooks</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">0% idle CPU overhead</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(262, 0)" filter="url(#cardShadowLight)">
      <rect width="242" height="92" rx="14" fill="#FFFFFF" stroke="url(#cardBorderGradLight)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🧱</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Dynamic Firewall</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">WFP transient filters</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Port Defender (Fail2ban)</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(524, 0)" filter="url(#cardShadowLight)">
      <rect width="242" height="92" rx="14" fill="#FFFFFF" stroke="url(#cardBorderGradLight)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🧠</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">AI Threat Analysis</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Kaspersky OpenTIP cloud</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Groq / Ollama / OpenAI</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(786, 0)" filter="url(#cardShadowLight)">
      <rect width="242" height="92" rx="14" fill="#FFFFFF" stroke="url(#cardBorderGradLight)" stroke-width="1.2"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18">🔒</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" fill="#0F172A">29-Location Guard</text>
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Safe Disable &amp; Restore</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Zero-Loss Persistence</text>
    </g>
  </g>
</svg>
