<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256">
  <defs>
    <!-- Градиент красного щита -->
    <linearGradient id="redShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <!-- Градиент молнии (энергичный золотисто-жёлтый) -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <!-- Внешнее свечение для молнии -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Точная геометрия щита из проекта (Fluent Shield) -->
  <path fill="url(#redShieldGrad)"
        d="M12.45 2.15C14.992 4.057 17.587 5 20.25 5a.75.75 0 0 1 .75.75V11c0 5.001-2.958 8.676-8.725 10.948a.75.75 0 0 1-.55 0C5.958 19.676 3 16 3 11V5.75A.75.75 0 0 1 3.75 5c2.663 0 5.258-.943 7.8-2.85a.75.75 0 0 1 .9 0z"/>

  <!-- Внутренний блик верхней грани щита -->
  <path fill="#FFFFFF" opacity="0.22"
        d="M12.45 2.15C14.992 4.057 17.587 5 20.25 5a.75.75 0 0 1 .75.75V7.5C18 7.3 15.5 6.4 12 4.7C8.5 6.4 6 7.3 3 7.5V5.75A.75.75 0 0 1 3.75 5c2.663 0 5.258-.943 7.8-2.85a.75.75 0 0 1 .9 0z"/>

  <!-- Молния по центру щита -->
  <path fill="url(#boltGrad)" filter="url(#glow)"
        d="M13.2 5.2 L8.2 12.3 H12.2 L10.4 18.8 L16.2 11.2 H12.2 Z"/>
</svg>
