name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: startup-monitor-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test tests/StartupMonitor.Tests/StartupMonitor.Tests.csproj -c Release -m:1 -p:ExcludePublishToSMon=true --nologo

      # Установщик собирается и проверяется локально до создания тега.
      # CI публикует этот же артефакт, исключая второй отличающийся установщик той же версии.
      - name: Verify release version and prepared installer
        id: release_assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid product version.' }
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match product version $version."
          }
          $installer = "installers/StartupMonitorSetup-$version.exe"
          $checksum = "$installer.sha256"
          $notes = "docs/releases/$tag.md"
          foreach ($path in @($installer, $checksum, $notes)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" }
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath $checksum -Raw -Encoding utf8).TrimStart([char]0xfeff).Trim() -split '\s+', 2
          if ($expected.Count -ne 2 -or $expected[0] -ne $actual -or $expected[1].TrimStart('*') -ne [IO.Path]::GetFileName($installer)) {
            throw 'Installer checksum or filename does not match the prepared release.'
          }
          $fileVersion = (Get-Item -LiteralPath $installer).VersionInfo.FileVersion
          if ([version]$fileVersion -ne [version]"$version.0") { throw "Wrong installer version: $fileVersion" }
          $headers = @{ Authorization = "Bearer $env:RELEASE_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
            throw "Release $tag already exists; existing releases must not be overwritten."
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "sha256=$actual" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Installer Artifacts
        if: steps.release_assets.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: StartupMonitor-Installer-v${{ steps.release_assets.outputs.version }}
          path: |
            ${{ steps.release_assets.outputs.installer }}
            ${{ steps.release_assets.outputs.installer }}.sha256
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: steps.release_assets.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.release_assets.outputs.version) }}
          name: Startup Monitor v${{ steps.release_assets.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_assets.outputs.notes }}
          files: |
            ${{ steps.release_assets.outputs.installer }}
            ${{ steps.release_assets.outputs.installer }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
